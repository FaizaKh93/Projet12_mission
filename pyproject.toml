[project]
name = "agritech-answers"
version = "0.1.0"
description = "Prédiction de rendement agricole et recommandation de culture — Agritech Answers"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Manipulation et analyse de données
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pyarrow>=16.0",
    # Visualisation
    "matplotlib>=3.8",
    "seaborn>=0.13",
    # Exécution des notebooks
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    # Suivi d'expériences et modélisation (étape 2)
    "mlflow>=3.17",
    "lightgbm>=4.7",
    "optuna>=5.0",
    # Interprétabilité : contributions par variable
    "shap>=0.54",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Le paquet s'appelle `agritech`, pas `agritech_answers` deduit du nom du projet
module-name = "agritech"
